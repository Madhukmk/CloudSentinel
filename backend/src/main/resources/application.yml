server:
  port: ${PORT:8088}
  servlet:
    context-path: /

spring:
  application:
    name: cloudsentinel-backend
  datasource:
    url: ${DB_URL:jdbc:h2:mem:cloudsentinel;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET:CloudSentinelSecureJwtSecretKeyForSIEMMonitoringPlatform2026TokenSignature}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.cloudsentinel: DEBUG
    org.springframework.security: INFO
